# dsh-submodel-change 的 bundle 补丁层(作为 bundle 安装时使用)。
# 若用「绝对路径直接挂载」方式,请改用 README 里的单行 insert,不要用本文件。
- insert:
    - id: submodel-change
      name: '@jason666not/dsh-submodel-change'
      # 如需覆盖默认配置,取消注释并按需修改:
      # config:
      #   enabled: true            # 总开关
      #   askOncePerParent: true   # 同一父会话的后续子代理复用第一次的选择
      #   allowDefault: true       # 选项里包含「使用默认模型(跟随父级)」
      #   extraModels: []          # 手动追加路由,如 ['openrouter/deepseek-r1']